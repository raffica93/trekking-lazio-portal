server {
  listen 8080;
  server_name www.trekking-cai.it;
  return 301 https://trekking-cai.it$request_uri;
}

server {
  listen 8080;
  server_name raffica93.github.io;
  rewrite ^/trekking-lazio-portal/?(.*)$ https://trekking-cai.it/$1 permanent;
  return 301 https://trekking-cai.it$request_uri;
}

server {
  listen 8080 default_server;
  server_name trekking-cai.it;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|woff2|svg|png|jpg|jpeg|webp|avif|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }
}
