name: Refresh excursion data

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'ID sezione CAI. Vuoto = tutte le fonti nazionali abilitate.'
        required: false
        default: ''
      region:
        description: 'Regione della sezione CAI (facoltativa).'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: manual-national-scraping
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Validate scraper
        run: npm test
        working-directory: backend
      - name: Collect national CAI calendars
        id: scrape
        continue-on-error: true
        working-directory: backend
        env:
          SCRAPE_RETRIES: 2
          SCRAPE_TIMEOUT_MS: 20000
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_TIMEOUT_MS: 300000
          GEMINI_PAUSE_MS: 15000
          SOURCE: ${{ github.event.inputs.source }}
          REGION: ${{ github.event.inputs.region }}
        run: |
          args=(--concurrency 8)
          if [ -n "${SOURCE}" ]; then
            args+=(--source "$SOURCE")
          else
            args+=(--all)
          fi
          if [ -n "${REGION}" ]; then args+=(--region "$REGION"); fi
          node --env-file-if-exists=.env scripts/scrape.js "${args[@]}"
      - name: Sync static site data
        shell: bash
        run: |
          cp backend/data/excursions.json frontend/public/excursions.json
          if [ -f backend/data/scrape-status.json ]; then
            cp backend/data/scrape-status.json frontend/public/scrape-status.json
          fi
      - name: Commit changed data
        shell: bash
        run: |
          if git diff --quiet -- backend/data/excursions.json backend/data/scrape-status.json frontend/public/excursions.json frontend/public/scrape-status.json; then
            echo "Excursion data is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/excursions.json backend/data/scrape-status.json frontend/public/excursions.json frontend/public/scrape-status.json
          git commit -m "chore(data): refresh excursions"
          git push origin HEAD:main
      - name: Import new places into Supabase
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_IMPORT_STATUS: published
        run: npm run import:supabase
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cai-italia-coverage
          path: |
            backend/data/scrape-status.json
            backend/data/cai-sections.json
      - name: Report collection failure
        if: steps.scrape.outcome == 'failure'
        run: exit 1
