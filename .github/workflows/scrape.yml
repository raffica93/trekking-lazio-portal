name: Refresh excursion data

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'ID sezione CAI. Vuoto = tutte le fonti nazionali abilitate.'
        required: false
        default: ''
      region:
        description: 'Regione della sezione CAI (facoltativa).'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: manual-national-scraping
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CAI_RUN_ID: cai-gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install PDF OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ita
      - run: npm ci
        working-directory: backend
      - name: Validate scraper
        run: npm test
        working-directory: backend
      - name: Create collection run
        working-directory: backend
        env:
          SOURCE: ${{ github.event.inputs.source }}
          REGION: ${{ github.event.inputs.region }}
        run: |
          args=(--concurrency 8)
          if [ -n "${SOURCE}" ]; then
            args+=(--source "$SOURCE")
          else
            args+=(--all)
          fi
          if [ -n "${REGION}" ]; then args+=(--region "$REGION"); fi
          npm run orchestrate -- init --run "$CAI_RUN_ID" "${args[@]}"
      - name: Collect calendars and verify files
        id: scrape
        working-directory: backend
        env:
          SCRAPE_RETRIES: 2
          SCRAPE_TIMEOUT_MS: 20000
        run: npm run orchestrate -- collect --run "$CAI_RUN_ID"
      - name: Sync static site data
        shell: bash
        run: |
          cp backend/data/excursions.json frontend/public/excursions.json
          if [ -f backend/data/scrape-status.json ]; then
            cp backend/data/scrape-status.json frontend/public/scrape-status.json
          fi
      - name: Import new places into Supabase
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_IMPORT_STATUS: published
        run: npm run orchestrate -- import --run "$CAI_RUN_ID"
      - name: Commit changed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/excursions.json backend/data/scrape-status.json frontend/public/excursions.json frontend/public/scrape-status.json
          git add "backend/data/agent-runs/$CAI_RUN_ID/state.json" "backend/data/agent-runs/$CAI_RUN_ID/manifest.json"
          git commit -m "chore(data): refresh excursions"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "Failed to push refreshed excursion data after retries"
          exit 1
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cai-italia-coverage
          path: |
            backend/data/scrape-status.json
            backend/data/cai-sections.json
            backend/data/agent-runs/${{ env.CAI_RUN_ID }}/
      - name: Report collection failure
        if: steps.scrape.outcome == 'failure'
        run: exit 1
