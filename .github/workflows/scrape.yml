name: Refresh excursion data

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Sede CAI (roma, tivoli, sora, …). Vuoto = tutte le abilitate, una alla volta.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: scheduled-scraping
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Validate scraper
        run: npm test
        working-directory: backend
      - name: Scrape sedi
        id: scrape
        continue-on-error: true
        working-directory: backend
        env:
          SCRAPE_RETRIES: 4
          SCRAPE_TIMEOUT_MS: 30000
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_TIMEOUT_MS: 300000
          GEMINI_PAUSE_MS: 4000
          SOURCE: ${{ github.event.inputs.source }}
        run: |
          if [ -n "${SOURCE}" ]; then
            node --env-file-if-exists=.env scripts/sede.js "$SOURCE"
          else
            node --env-file-if-exists=.env scripts/sede.js all
          fi
      - name: Sync static site data
        shell: bash
        run: |
          cp backend/data/excursions.json frontend/public/excursions.json
          if [ -f backend/data/scrape-status.json ]; then
            cp backend/data/scrape-status.json frontend/public/scrape-status.json
          fi
      - name: Commit changed data
        shell: bash
        run: |
          if git diff --quiet -- backend/data/excursions.json backend/data/scrape-status.json frontend/public/excursions.json frontend/public/scrape-status.json; then
            echo "Excursion data is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/excursions.json backend/data/scrape-status.json frontend/public/excursions.json frontend/public/scrape-status.json
          git commit -m "chore(data): refresh excursions"
          git push origin HEAD:main
      - name: Import new places into Supabase
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_IMPORT_STATUS: published
        run: npm run import:supabase
      - name: Fail if a sede had no cache
        if: steps.scrape.outcome == 'failure'
        run: exit 1
