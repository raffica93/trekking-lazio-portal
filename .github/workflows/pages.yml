name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      # The custom domain is served from the root, not from the repository path.
      - run: npm run build -- --base-href "/"
      # Keep the custom-domain marker in the Pages artifact. Without it, a
      # deployment can fall back to the github.io hostname and HTTPS may be
      # served with the wrong certificate for trekking-cai.it.
      - name: Preserve custom domain
        shell: bash
        run: |
          test "$(cat public/CNAME)" = "trekking-cai.it"
          printf 'trekking-cai.it\n' > dist/frontend/browser/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
